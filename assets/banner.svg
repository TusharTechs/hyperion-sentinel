<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Hyperion Sentinel - edge readiness engineer for the HYPER-AI IDE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#0E1736"/><stop offset="1" stop-color="#1B1650"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4E"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".35"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5EEAD4" stroke-opacity=".06" stroke-width="1"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="190" cy="170" r="190" fill="url(#halo)"/>
  <!-- radar arcs -->
  <g fill="none" stroke="#5EEAD4" stroke-opacity=".10"><circle cx="190" cy="170" r="120"/><circle cx="190" cy="170" r="160"/><circle cx="190" cy="170" r="205"/></g>
  <!-- mark -->
  <g transform="translate(78 58) scale(1.9)">
    <path d="M64 7 L113 25 V62 C113 91 92 111 64 121 C36 111 15 91 15 62 V25 Z" fill="url(#sh)" stroke="url(#rim)" stroke-width="3.5" stroke-linejoin="round"/>
    <g filter="url(#glow)" stroke="#FBBF24" stroke-width="3.2" stroke-linecap="round"><line x1="64" y1="21" x2="64" y2="28"/><line x1="43" y1="30" x2="48" y2="35"/><line x1="85" y1="30" x2="80" y2="35"/><line x1="34" y1="49" x2="41" y2="49"/><line x1="94" y1="49" x2="87" y2="49"/><line x1="43" y1="68" x2="48" y2="63"/><line x1="85" y1="68" x2="80" y2="63"/></g>
    <circle cx="64" cy="49" r="13.5" fill="url(#sun)" filter="url(#glow)"/>
    <path d="M30 78 H98" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
    <path d="M44 90 L57 103 L84 76" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <!-- title -->
  <g font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="360" y="150" font-size="76" font-weight="800" fill="url(#tx)" letter-spacing="-1.5">Hyperion Sentinel</text>
    <text x="364" y="200" font-size="26" fill="#C7D2FE" fill-opacity=".92">The edge-readiness engineer inside the HYPER-AI IDE</text>
    <g font-size="19" font-weight="600">
      <rect x="364" y="232" width="150" height="40" rx="20" fill="#5EEAD4" fill-opacity=".12" stroke="#5EEAD4" stroke-opacity=".5"/><text x="439" y="259" text-anchor="middle" fill="#99F6E4">Inspect</text>
      <rect x="530" y="232" width="150" height="40" rx="20" fill="#93C5FD" fill-opacity=".12" stroke="#93C5FD" stroke-opacity=".5"/><text x="605" y="259" text-anchor="middle" fill="#BFDBFE">Explain</text>
      <rect x="696" y="232" width="150" height="40" rx="20" fill="#C4B5FD" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".5"/><text x="771" y="259" text-anchor="middle" fill="#DDD6FE">Fix safely</text>
      <rect x="862" y="232" width="150" height="40" rx="20" fill="#FCD34D" fill-opacity=".12" stroke="#FCD34D" stroke-opacity=".5"/><text x="937" y="259" text-anchor="middle" fill="#FDE68A">Verify</text>
    </g>
  </g>
  <!-- score card -->
  <g font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="1050" y="66" width="190" height="208" rx="18" fill="#0A1124" stroke="#5EEAD4" stroke-opacity=".28"/>
    <text x="1145" y="98" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#94A3B8">EDGE READINESS</text>
    <text x="1103" y="168" text-anchor="middle" font-size="46" font-weight="800" fill="#F87171">35</text>
    <path d="M1130 156 H1160 M1152 148 L1161 156 L1152 164" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1190" y="168" text-anchor="middle" font-size="46" font-weight="800" fill="#5EEAD4">65</text>
    <rect x="1074" y="196" width="142" height="9" rx="4.5" fill="#1E293B"/><rect x="1074" y="196" width="92" height="9" rx="4.5" fill="#5EEAD4"/>
    <text x="1145" y="236" text-anchor="middle" font-size="14" fill="#CBD5E1">+30 after safe fixes</text>
    <text x="1145" y="258" text-anchor="middle" font-size="11" fill="#64748B">heuristic - not an official metric</text>
  </g>
</svg>
