<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><text x="100" y="120" font-size="58" font-weight="800" fill="url(#tx)">One conversation instead of a manual audit</text><text x="100" y="170" font-size="28" fill="#94A3B8">Hyperion Sentinel, inside the HYPER-AI IDE</text><rect x="100" y="260" width="325" height="400" rx="22" fill="#0E1A3A" stroke="#5EEAD4" stroke-opacity=".6" stroke-width="2"/><text x="262" y="400" text-anchor="middle" font-size="62" font-weight="800" fill="#5EEAD4">35 → 65</text><text x="262" y="470" text-anchor="middle" font-size="24" fill="#CBD5E1">edge readiness,</text><text x="262" y="504" text-anchor="middle" font-size="24" fill="#CBD5E1">verified by re-reading</text><text x="262" y="538" text-anchor="middle" font-size="24" fill="#CBD5E1">the IDE</text><rect x="458" y="260" width="325" height="400" rx="22" fill="#0E1A3A" stroke="#93C5FD" stroke-opacity=".6" stroke-width="2"/><text x="620" y="400" text-anchor="middle" font-size="78" font-weight="800" fill="#93C5FD">7</text><text x="620" y="470" text-anchor="middle" font-size="24" fill="#CBD5E1">analysis areas:</text><text x="620" y="504" text-anchor="middle" font-size="24" fill="#CBD5E1">Docker, K8s, Compose,</text><text x="620" y="538" text-anchor="middle" font-size="24" fill="#CBD5E1">HYPER-AI profiles,</text><text x="620" y="572" text-anchor="middle" font-size="24" fill="#CBD5E1">deps, secrets,</text><text x="620" y="606" text-anchor="middle" font-size="24" fill="#CBD5E1">completeness</text><rect x="816" y="260" width="325" height="400" rx="22" fill="#0E1A3A" stroke="#FCD34D" stroke-opacity=".6" stroke-width="2"/><text x="978" y="400" text-anchor="middle" font-size="78" font-weight="800" fill="#FCD34D">0</text><text x="978" y="470" text-anchor="middle" font-size="24" fill="#CBD5E1">changes without your</text><text x="978" y="504" text-anchor="middle" font-size="24" fill="#CBD5E1">explicit yes - every</text><text x="978" y="538" text-anchor="middle" font-size="24" fill="#CBD5E1">delete, overwrite and</text><text x="978" y="572" text-anchor="middle" font-size="24" fill="#CBD5E1">plan asks first</text><rect x="1174" y="260" width="325" height="400" rx="22" fill="#0E1A3A" stroke="#C4B5FD" stroke-opacity=".6" stroke-width="2"/><text x="1336" y="400" text-anchor="middle" font-size="78" font-weight="800" fill="#C4B5FD">203</text><text x="1336" y="470" text-anchor="middle" font-size="24" fill="#CBD5E1">automated tests, a</text><text x="1336" y="504" text-anchor="middle" font-size="24" fill="#CBD5E1">real IDE run, and a</text><text x="1336" y="538" text-anchor="middle" font-size="24" fill="#CBD5E1">live Llama 3.1 run</text><text x="100" y="780" font-size="30" font-weight="700" fill="#FDE68A">Deterministic tools produce the facts. The LLM only converses.</text></svg>