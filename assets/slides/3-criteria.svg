<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><text x="100" y="120" font-size="54" font-weight="800" fill="url(#tx)">Every challenge criterion - verified</text><text x="100" y="168" font-size="26" fill="#94A3B8">203 automated tests, a real IDE run, and a live Llama 3.1 run</text><rect x="100" y="230" width="1400" height="96" rx="18" fill="#0E1A3A" stroke="#5EEAD4" stroke-opacity=".55" stroke-width="2"/><circle cx="160" cy="278" r="28" fill="#5EEAD4" fill-opacity=".15" stroke="#5EEAD4"/><text x="160" y="288" text-anchor="middle" font-size="30" font-weight="800" fill="#5EEAD4">1</text><text x="220" y="274" font-size="32" font-weight="700" fill="#E2E8F0">Working agent + IDE actions</text><text x="220" y="308" font-size="23" fill="#94A3B8">create / edit / delete files, opened in the editor</text><rect x="100" y="342" width="1400" height="96" rx="18" fill="#0E1A3A" stroke="#F87171" stroke-opacity=".55" stroke-width="2"/><circle cx="160" cy="390" r="28" fill="#F87171" fill-opacity=".15" stroke="#F87171"/><text x="160" y="400" text-anchor="middle" font-size="30" font-weight="800" fill="#F87171">2</text><text x="220" y="386" font-size="32" font-weight="700" fill="#E2E8F0">Guardrails</text><text x="220" y="420" font-size="23" fill="#94A3B8">scope + prompt-injection rules; fails closed; never touches files</text><rect x="100" y="454" width="1400" height="96" rx="18" fill="#0E1A3A" stroke="#93C5FD" stroke-opacity=".55" stroke-width="2"/><circle cx="160" cy="502" r="28" fill="#93C5FD" fill-opacity=".15" stroke="#93C5FD"/><text x="160" y="512" text-anchor="middle" font-size="30" font-weight="800" fill="#93C5FD">3</text><text x="220" y="498" font-size="32" font-weight="700" fill="#E2E8F0">RAG</text><text x="220" y="532" font-size="23" fill="#94A3B8">BM25 over the official HYPER-AI docs; cited; admits gaps</text><rect x="100" y="566" width="1400" height="96" rx="18" fill="#0E1A3A" stroke="#C4B5FD" stroke-opacity=".55" stroke-width="2"/><circle cx="160" cy="614" r="28" fill="#C4B5FD" fill-opacity=".15" stroke="#C4B5FD"/><text x="160" y="624" text-anchor="middle" font-size="30" font-weight="800" fill="#C4B5FD">4</text><text x="220" y="610" font-size="32" font-weight="700" fill="#E2E8F0">Memory</text><text x="220" y="644" font-size="23" fill="#94A3B8">per user_id: findings, plan, facts, last file - fix the second issue</text><rect x="100" y="678" width="1400" height="96" rx="18" fill="#0E1A3A" stroke="#FCD34D" stroke-opacity=".55" stroke-width="2"/><circle cx="160" cy="726" r="28" fill="#FCD34D" fill-opacity=".15" stroke="#FCD34D"/><text x="160" y="736" text-anchor="middle" font-size="30" font-weight="800" fill="#FCD34D">5</text><text x="220" y="722" font-size="32" font-weight="700" fill="#E2E8F0">Human-in-the-loop</text><text x="220" y="756" font-size="23" fill="#94A3B8">every delete, overwrite and plan waits for an explicit yes</text><rect x="100" y="790" width="1400" height="66" rx="18" fill="#F59E0B" fill-opacity=".10" stroke="#F59E0B" stroke-opacity=".6" stroke-width="2"/><text x="140" y="833" font-size="27" font-weight="700" fill="#FDE68A">Differentiator: deterministic Edge Readiness analyzer + safe auto-fix, re-verified via the IDE</text></svg>