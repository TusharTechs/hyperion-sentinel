<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#0E1736"/><stop offset="1" stop-color="#1B1650"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4E"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".30"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5EEAD4" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:'Helvetica Neue','Inter','Segoe UI',Arial,sans-serif}</style>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><text x="100" y="120" font-size="58" font-weight="800" fill="url(#tx)">Edge deployments fail on the basics</text><text x="100" y="170" font-size="28" fill="#94A3B8">From IoT devices to the cloud, constrained nodes punish sloppy configuration</text><rect x="100" y="235" width="1400" height="100" rx="18" fill="#0E1A3A" stroke="#F87171" stroke-opacity=".6" stroke-width="2"/><text x="150" y="297" font-size="38" font-weight="700" fill="#F87171" style="font-family:Menlo,Consolas,monospace">image: app:latest</text><text x="760" y="295" font-size="30" fill="#CBD5E1">unpinned images change under you</text><rect x="100" y="355" width="1400" height="100" rx="18" fill="#0E1A3A" stroke="#FB923C" stroke-opacity=".6" stroke-width="2"/><text x="150" y="417" font-size="38" font-weight="700" fill="#FB923C" style="font-family:Menlo,Consolas,monospace">no resources.limits</text><text x="760" y="415" font-size="30" fill="#CBD5E1">one container can starve the node</text><rect x="100" y="475" width="1400" height="100" rx="18" fill="#0E1A3A" stroke="#FBBF24" stroke-opacity=".6" stroke-width="2"/><text x="150" y="537" font-size="38" font-weight="700" fill="#FBBF24" style="font-family:Menlo,Consolas,monospace">no readiness probe</text><text x="760" y="535" font-size="30" fill="#CBD5E1">traffic hits pods that are not ready</text><rect x="100" y="595" width="1400" height="100" rx="18" fill="#0E1A3A" stroke="#F472B6" stroke-opacity=".6" stroke-width="2"/><text x="150" y="657" font-size="38" font-weight="700" fill="#F472B6" style="font-family:Menlo,Consolas,monospace">runs as root</text><text x="760" y="655" font-size="30" fill="#CBD5E1">a breach owns the host</text><rect x="100" y="715" width="1400" height="100" rx="18" fill="#0E1A3A" stroke="#C4B5FD" stroke-opacity=".6" stroke-width="2"/><text x="150" y="777" font-size="38" font-weight="700" fill="#C4B5FD" style="font-family:Menlo,Consolas,monospace">password in config</text><text x="760" y="775" font-size="30" fill="#CBD5E1">secrets leak through git and images</text><text x="100" y="870" font-size="26" fill="#94A3B8">...and developers lose hours digging through YAML to find them.</text></svg>