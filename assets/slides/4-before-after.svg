<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#0E1736"/><stop offset="1" stop-color="#1B1650"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A4E"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".30"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5EEAD4" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:'Helvetica Neue','Inter','Segoe UI',Arial,sans-serif}</style>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><text x="100" y="120" font-size="54" font-weight="800" fill="url(#tx)">From "latest" to edge-ready in four messages</text><text x="100" y="168" font-size="26" fill="#94A3B8">Hero demo: a deliberately imperfect app in the HYPER-AI IDE</text><rect x="100" y="215" width="740" height="585" rx="22" fill="#0E1A3A" stroke="#F87171" stroke-opacity=".5" stroke-width="2"/><text x="140" y="268" font-size="22" font-weight="700" letter-spacing="3" fill="#94A3B8">BEFORE</text><text x="140" y="400" font-size="150" font-weight="800" fill="#F87171">35</text><text x="440" y="400" font-size="44" fill="#64748B">/100</text><g font-size="26" fill="#CBD5E1"><text x="140" y="470">HIGH    no resource requests / limits</text><text x="140" y="512">HIGH    no readiness probe</text><text x="140" y="554">MEDIUM  image uses :latest</text><text x="140" y="596">MEDIUM  runs as root, no HEALTHCHECK</text><text x="140" y="638">LOW     no .dockerignore, replicas: 5</text><text x="140" y="680">HIGH    hardcoded secret (manual)</text></g><path d="M870 507 H915 M900 485 L920 507 L900 529" stroke="#5EEAD4" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="940" y="215" width="560" height="585" rx="22" fill="#0E1A3A" stroke="#5EEAD4" stroke-opacity=".6" stroke-width="2"/><text x="980" y="268" font-size="22" font-weight="700" letter-spacing="3" fill="#94A3B8">AFTER</text><text x="980" y="400" font-size="150" font-weight="800" fill="#5EEAD4">65</text><text x="1260" y="400" font-size="44" fill="#64748B">/100</text><text x="980" y="462" font-size="30" font-weight="700" fill="#99F6E4">+30 improvement</text><g font-size="25" fill="#CBD5E1"><text x="980" y="520">12 findings resolved</text><text x="980" y="562">files rewritten in the IDE</text><text x="980" y="604">re-read and re-analyzed</text><text x="980" y="646" fill="#FCD34D">5 manual actions remain</text><text x="980" y="688" fill="#94A3B8">(secret, deps, tags ...)</text></g><text x="100" y="850" font-size="22" fill="#64748B">Score = Sentinel's own deterministic heuristic - not an official HYPER-AI metric. Numbers from a real run.</text></svg>